# =============================================================================
# HIREBYMINUTES — RENDER BLUEPRINT SPECIFICATION (render.yaml)
# =============================================================================
# Configured for Render Free Web Service Deployment (100% Free Plan Tier)
# Ephemeral filesystem safe: Uses external PostgreSQL & S3/R2 Object Storage
# =============================================================================

services:
  - type: web
    name: hirebyminutes
    env: node
    plan: free # Free Tier Web Service on Render
    region: oregon # or frankfurt, ohio, singapore
    buildCommand: npm install && npm --prefix client install --include=dev && npm --prefix client run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false # External free PostgreSQL connection string (e.g. Neon, Supabase, Aiven)
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PLATFORM_NAME
        value: HireByMinutes
      - key: LISTING_FEE_USD
        value: "2.00"
      - key: PLATFORM_FEE_PERCENT
        value: "15"
      - key: STORAGE_PROVIDER
        value: s3 # or r2, local
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: "HireByMinutes <no-reply@hirebyminutes.com>"
      - key: EMAIL_FROM_NAME
        value: "HireByMinutes"
      - key: EMAIL_REPLY_TO
        value: "support@hirebyminutes.com"
      - key: EMAIL_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: PASSWORD_RESET_EXPIRY_MINUTES
        value: "30"
